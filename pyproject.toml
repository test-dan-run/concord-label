[project]
name = "concord-label"
version = "0.2.0"
description = "Concord Label: pseudo-label speech audio (ASR, diarisation) with models served by the personal AI platform, then review it"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "python-multipart>=0.0.20",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.11",
    "sqlalchemy>=2.0.44",
    "alembic>=1.17",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "numpy>=2.1",
    "soundfile>=0.13",
    "soxr>=0.5",
    "jiwer>=4.0",
    "pyannote.metrics>=4.0",
    "meeteval>=0.4",
    "whisper-normalizer>=0.1.12",
    "aicore[oip]",
]

# Phase 3 (Improve, backend/concord_improve) is on hold: it is installed in no image. When it is scoped
# (PLAN.md Q5), its training dependencies come back as an optional `full` extra for a concord-label-full image.

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
    "import-linter>=2.5",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/concord_label", "backend/concord_improve"]

[tool.uv.sources]
aicore = { path = "../../platform/clients/aicore", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "tests"]
addopts = "--import-mode=importlib -m 'not live'"
markers = [
    "live: needs running platform services (run with `just test-live`)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["backend", "tests"]
extend-exclude = ["backend/concord_label/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]
